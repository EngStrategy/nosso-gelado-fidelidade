<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo do selo -->
    <linearGradient id="stampBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0545"/>
      <stop offset="50%" stop-color="#4a0e78"/>
      <stop offset="100%" stop-color="#19022b"/>
    </linearGradient>

    <!-- Gradiente do Açaí -->
    <linearGradient id="acaiCamada1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f0330"/>
      <stop offset="100%" stop-color="#340750"/>
    </linearGradient>
    <linearGradient id="acaiCamada2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b388eb"/>
      <stop offset="100%" stop-color="#d1b3f7"/>
    </linearGradient>
    <linearGradient id="acaiCamada3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d0545"/>
      <stop offset="100%" stop-color="#4b0a70"/>
    </linearGradient>
    <filter id="brilho" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fundo circular com borda vibrante -->
  <circle cx="80" cy="80" r="76" fill="url(#stampBg)" stroke="#8c43ec" stroke-width="3" filter="url(#brilho)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#b388eb" stroke-dasharray="3,3" stroke-width="1.5" opacity="0.6"/>

  <!-- Garrafa "Nosso Gelado" estilizada -->
  <g transform="translate(42, 22) rotate(-5, 38, 58)">
    <!-- Tampa -->
    <rect x="26" y="6" width="24" height="10" rx="3" fill="#b388eb" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="29" y="15" width="18" height="4" rx="1" fill="#8c43ec"/>

    <!-- Corpo da Garrafa -->
    <path d="M 23 20 
             C 23 20, 20 28, 16 38 
             C 12 50, 14 95, 17 106 
             C 19 111, 23 113, 38 113 
             C 53 113, 57 111, 59 106 
             C 62 95, 64 50, 60 38 
             C 56 28, 53 20, 53 20 Z" 
          fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Camadas de Açaí dentro da garrafa (com ondas) -->
    <!-- Camada inferior escura -->
    <path d="M 17 90 
             Q 28 85, 38 92 
             Q 48 99, 59 93 
             L 58 106 C 56 111, 53 113, 38 113 C 23 113, 20 111, 18 106 Z" 
          fill="url(#acaiCamada1)"/>

    <!-- Camada do meio clara/lilás -->
    <path d="M 16 70 
             Q 27 65, 38 72 
             Q 49 79, 60 71 
             L 59 93 
             Q 48 99, 38 92 
             Q 28 85, 17 90 Z" 
          fill="url(#acaiCamada2)"/>

    <!-- Camada superior açaí intenso -->
    <path d="M 15 50 
             Q 26 44, 38 52 
             Q 50 60, 61 51 
             L 60 71 
             Q 49 79, 38 72 
             Q 27 65, 16 70 Z" 
          fill="url(#acaiCamada3)"/>

    <!-- Coração na garrafa -->
    <path d="M 38 38 
             C 38 35, 33 32, 30 35 
             C 26 39, 29 44, 38 49 
             C 47 44, 50 39, 46 35 
             C 43 32, 38 35, 38 38 Z" 
          fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Brilho no vidro da garrafa -->
    <path d="M 21 32 C 18 45, 19 80, 21 95" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Pequeno coração flutuante -->
  <path d="M 112 40 
           C 112 37, 108 34, 105 37 
           C 101 41, 104 46, 112 51 
           C 120 46, 123 41, 119 37 
           C 116 34, 112 37, 112 40 Z" 
        fill="#b388eb" opacity="0.9"/>
</svg>
